# Nudges cooks about paid orders that sat unacknowledged for 45+ minutes.
# Calls the app's reminder endpoint every 15 minutes; the endpoint decides
# who (if anyone) actually gets an email, at most once per order.
#
# Setup: add a CRON_SECRET repository secret (GitHub → Settings → Secrets)
# with the same value as the CRON_SECRET env var on Render.
name: Order reminders

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the reminder endpoint
        run: |
          # Generous timeout + retries ride out Render's free-tier cold start.
          curl -sS --fail-with-body -X POST \
            --max-time 120 --retry 3 --retry-delay 20 --retry-all-errors \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://forkfork.app/api/cron/remind-orders

      # Sends refunds for cancelled orders whose 24-hour hold is over (see
      # app/api/cron/refund-cancelled). It rides along on this workflow so it
      # runs as often as GitHub lets this one run; the endpoint is safe to hit
      # from overlapping runs. `if: always()` — a hiccup in the step above
      # must not delay a buyer's refund. A 404 only means the app build that
      # has this endpoint isn't deployed yet, which is not a failure.
      - name: Send refunds that are past their hold
        if: always()
        run: |
          code=$(curl -sS -o refunds.json -w "%{http_code}" -X POST \
            --max-time 120 --retry 3 --retry-delay 20 --retry-all-errors \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://forkfork.app/api/cron/refund-cancelled)
          cat refunds.json 2>/dev/null || true
          echo
          if [ "$code" = "404" ]; then
            echo "::notice::Refund endpoint not deployed yet; skipping."
            exit 0
          fi
          if [ "$code" != "200" ]; then
            echo "::error::Refund sweep answered HTTP $code"
            exit 1
          fi
